[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunashake"
version = "0.1.0"
description = "Local CLI study tool for math and physics exercises"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3"]

[project.scripts]
tunashake = "tunashake.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
